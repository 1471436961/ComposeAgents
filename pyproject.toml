[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nooa-patterns"
version = "0.0.1"
description = "Lightweight collaboration patterns for NOOA agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa @ git+https://github.com/NVIDIA-NeMo/labs-OO-Agents.git@main",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
